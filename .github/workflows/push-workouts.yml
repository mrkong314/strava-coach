name: Push planned workouts to intervals.icu

on:
  schedule:
    # Hourly, on the hour (UTC). GitHub cron is best-effort and may slip;
    # the windowed upsert is idempotent so a late run is harmless.
    - cron: "0 * * * *"
  workflow_dispatch:
    # Manual "Run workflow" button -- use right after a day-of adjustment
    # to push the change immediately instead of waiting for the next hour.
    inputs:
      dry_run:
        description: "Dry run (log actions, write nothing)"
        required: false
        default: "0"

# Avoid overlapping runs if one is slow.
concurrency:
  group: push-workouts
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Push workouts
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          WINDOW_DAYS: "14"
          TZID: "Australia/Melbourne"
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/push_workouts.py
