name: Stream metrics

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compute + print, write nothing)"
        type: boolean
        default: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Compute stream metrics
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          CRAFT_API_BASE: ${{ secrets.CRAFT_API_BASE }}
          # Update these two alongside coach.py when LTHR changes
          # (see the Coaching Reference constants checklist)
          LTHR_BIKE: "165"
          LTHR_RUN: "175"
          WPRIME_J: "20000"
        run: |
          python3 metrics.py ${{ inputs.dry_run && '--dry-run' || '' }}
