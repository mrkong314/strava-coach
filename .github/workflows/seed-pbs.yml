name: Seed PBs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print the seed, write nothing to Craft)"
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run seed_pbs
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          CRAFT_API_BASE: ${{ secrets.CRAFT_API_BASE }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          python3 seed_pbs.py ${{ inputs.dry_run && '--dry-run' || '' }}JSON_BUDGET = 8500
SEED_SECTION = "pb_seed"

# Strava run best_effort name -> Current PBs metric name
RUN_SPLIT_METRICS = {
    "400m": "400m PB", "1/2 mile": "half-mile PB", "1k": "1K PB",
    "1 mile": "1mi PB", "2 mile": "2mi PB", "5k": "5K PB", "10k": "10K PB",
    "15k": "15K PB", "10 mile": "10mi PB", "20k": "20K PB",
    "Half-Marathon": "Half PB", "30k": "30K PB", "Marathon": "Marathon PB",
    "50k": "50K PB",
}

# power-curve buckets (seconds) -> metric name
POWER_BUCKETS = [(5, "5s Power PB"), (15, "15s Power PB"), (30, "30s Power PB"),
                 (60, "1min Power PB"), (120, "2min Power PB"),
                 (180, "3min Power PB"), (300, "5min Power PB"),
                 (480, "8min Power PB"), (600, "10min Power PB"),
                 (900, "15min Power PB"), (1200, "20min Power PB"),
                 (1800, "30min Power PB"), (2700, "45min Power PB"),
                 (3600, "1hr Power PB")]


def hms(seconds):
    s = int(round(seconds))
    return f"{s // 3600}:{(s % 3600) // 60:02d}:{s % 60:02d}"


# ---------------------------------------------------------------- Intervals

def iget(path, params=None):
    r = requests.get(f"{INTERVALS_BASE}{path}", params=params or {},
                     auth=("API_KEY", INTERVALS_API_KEY), timeout=120)
    r.raise_for_status()
    return r.json()


def fetch_all_activities():
    today = dt.datetime.now(MELBOURNE).date()
    return iget(f"/athlete/{INTERVALS_ATHLETE_ID}/activities",
                {"oldest": HISTORY_OLDEST.isoformat(),
                 "newest": today.isoformat()})


def summary_bars(activities):
    """Longest run/ride/swim, most climbing - computable from summaries."""
    bars = {}

    def consider(metric, value, disp, a, unit):
        if value and (metric not in bars or value > bars[metric]["_v"]):
            bars[metric] = {
                "_v": value, "metric": metric, "value": disp, "unit": unit,
                "date": (a.get("start_date_local") or "")[:10],
                "sport": a.get("type") or "",
                "activity_id": str(a.get("id") or ""),
                "strava_id": str(a.get("strava_id") or ""),
                "source": "intervals-summary",
            }

    for a in activities:
        t = (a.get("type") or "").lower()
        km = (a.get("distance") or 0) / 1000.0
        elev = a.get("total_elevation_gain") or 0
        if "run" in t:
            consider("Longest Run", km, f"{km:.2f} km", a, "km")
        elif "ride" in t or "virtualride" in t:
            consider("Longest Ride", km, f"{km:.2f} km", a, "km")
            consider("Most Climbing", elev, f"{elev:.0f} m", a, "m")
        elif "swim" in t:
            consider("Longest Swim", km, f"{km:.2f} km", a, "km")
    return list(bars.values())


def power_curve_bars():
    """Opportunistic all-time ride power curve from Intervals. Skipped with a
    note if the endpoint is not available in the expected shape."""
    try:
        data = iget(f"/athlete/{INTERVALS_ATHLETE_ID}/power-curves",
                    {"type": "Ride", "curves": "all"})
    except Exception as e:  # noqa: BLE001 - opportunistic
        print(f"power-curve endpoint unavailable, skipping power PBs: {e}")
        return []
    # expected: {"secs": [...], "watts": [[...]]} or a list of curve objects
    secs, watts = None, None
    if isinstance(data, dict):
        secs = data.get("secs")
        w = data.get("watts")
        watts = w[0] if isinstance(w, list) and w and isinstance(w[0], list) else w
    elif isinstance(data, list) and data and isinstance(data[0], dict):
        secs = data[0].get("secs")
        watts = data[0].get("watts")
    if not secs or not watts:
        print("power-curve response shape not recognised, skipping power PBs")
        return []
    out = []
    for target, metric in POWER_BUCKETS:
        best = None
        for s, w in zip(secs, watts):
            if s is None or w is None:
                continue
            if abs(s - target) <= max(1, target * 0.02):
                best = max(best or 0, w)
        if best:
            out.append({"metric": metric, "value": f"{best:.0f} W",
                        "unit": "W", "date": "", "sport": "Ride",
                        "activity_id": "", "strava_id": "",
                        "source": "intervals-power-curve"})
    return out


# ------------------------------------------------------------------ Strava

def strava_token():
    r = requests.post("https://www.strava.com/oauth/token", data={
        "client_id": STRAVA_CLIENT_ID, "client_secret": STRAVA_CLIENT_SECRET,
        "grant_type": "refresh_token", "refresh_token": STRAVA_REFRESH_TOKEN,
    }, timeout=60)
    r.raise_for_status()
    return r.json()["access_token"]


def run_split_bars():
    """Run distance-split PBs from Strava best_efforts (runs only)."""
    if not (STRAVA_CLIENT_ID and STRAVA_CLIENT_SECRET and STRAVA_REFRESH_TOKEN):
        print("Strava creds absent - run split PBs skipped (stay dormant).")
        return []
    token = strava_token()
    hdr = {"Authorization": f"Bearer {token}"}
    runs, page = [], 1
    while True:
        r = requests.get(f"{STRAVA_BASE}/athlete/activities",
                         params={"per_page": 200, "page": page},
                         headers=hdr, timeout=120)
        r.raise_for_status()
        batch = r.json()
        if not batch:
            break
        runs.extend(a for a in batch if (a.get("type") or "").lower() == "run")
        page += 1
        time.sleep(0.6)  # stay well under 100 req / 15 min
    print(f"Strava: {len(runs)} runs to scan for best_efforts")
    bars = {}
    for i, a in enumerate(runs):
        r = requests.get(f"{STRAVA_BASE}/activities/{a['id']}",
                         params={"include_all_efforts": "false"},
                         headers=hdr, timeout=120)
        if r.status_code == 429:
            print("Strava rate limit hit - sleeping 15 min")
            time.sleep(15 * 60)
            r = requests.get(f"{STRAVA_BASE}/activities/{a['id']}",
                             headers=hdr, timeout=120)
        r.raise_for_status()
        detail = r.json()
        for be in detail.get("best_efforts") or []:
            metric = RUN_SPLIT_METRICS.get(be.get("name"))
            if not metric:
                continue
            sec = be.get("elapsed_time")
            if sec and (metric not in bars or sec < bars[metric]["_v"]):
                bars[metric] = {
                    "_v": sec, "metric": metric, "value": hms(sec),
                    "unit": "h:mm:ss",
                    "date": (a.get("start_date_local") or "")[:10],
                    "sport": "Run", "activity_id": "",
                    "strava_id": str(a["id"]), "source": "strava-best-efforts",
                }
        if i and i % 50 == 0:
            print(f"  scanned {i}/{len(runs)} runs")
        time.sleep(0.6)
    return list(bars.values())


# ------------------------------------------------------- Craft (as coach.py)

def craft_document_id():
    r = requests.get(f"{CRAFT_API_BASE}/documents", timeout=30)
    r.raise_for_status()
    live = [d for d in r.json().get("items", []) if not d.get("isDeleted")]
    if not live:
        raise RuntimeError("No documents available on the Craft connection.")
    return live[0]["id"]


def craft_get_blocks(block_id):
    r = requests.get(f"{CRAFT_API_BASE}/blocks", params={"id": block_id},
                     timeout=30)
    r.raise_for_status()
    return r.json()


def craft_post(markdown, doc_id, position="end"):
    r = requests.post(f"{CRAFT_API_BASE}/blocks",
                      json={"markdown": markdown,
                            "position": {"position": position,
                                         "pageId": doc_id}}, timeout=60)
    r.raise_for_status()
    return r.json()


def craft_delete(block_ids):
    ids = [x for x in block_ids if x]
    if not ids:
        return
    r = requests.delete(f"{CRAFT_API_BASE}/blocks",
                        json={"blockIds": ids}, timeout=60)
    r.raise_for_status()


def _walk(node, out):
    if isinstance(node, dict):
        out.append(node)
        for child in node.get("content", []) or []:
            _walk(child, out)
    elif isinstance(node, list):
        for child in node:
            _walk(child, out)


def _extract_json(markdown):
    if not markdown:
        return None
    text = markdown.strip()
    m = re.search(r"```(?:json)?\s*(\{.*\})\s*```", text, re.DOTALL)
    if m:
        text = m.group(1)
    if not text.startswith("{"):
        return None
    try:
        return json.loads(text)
    except json.JSONDecodeError:
        return None


def write_seed(items):
    doc_id = craft_document_id()
    blocks = []
    _walk(craft_get_blocks(doc_id), blocks)
    old = [b.get("id") for b in blocks
           if (_extract_json(b.get("markdown", "")) or {}).get("_section")
           == SEED_SECTION]
    craft_delete(old)
    stamp = dt.datetime.now(MELBOURNE).isoformat(timespec="seconds")
    payload = {"_section": SEED_SECTION, "_part": 0, "_updated": stamp,
               "items": items}
    body = json.dumps(payload, separators=(",", ":"))
    if len(body) > JSON_BUDGET:
        # split into two parts if ever needed (unlikely at this size)
        half = len(items) // 2
        for i, chunk in enumerate((items[:half], items[half:])):
            p = {"_section": SEED_SECTION, "_part": i, "_updated": stamp,
                 "items": chunk}
            craft_post("```json\n" + json.dumps(p, separators=(",", ":"))
                       + "\n```", doc_id)
    else:
        craft_post("```json\n" + body + "\n```", doc_id)
    print(f"pb_seed written: {len(items)} bars.")


def main():
    ap = argparse.ArgumentParser()
    ap.add_argument("--dry-run", action="store_true")
    args = ap.parse_args()

    activities = fetch_all_activities()
    print(f"Intervals: {len(activities)} activities in history")
    items = summary_bars(activities)
    items += power_curve_bars()
    items += run_split_bars()
    for it in items:
        it.pop("_v", None)
    items.sort(key=lambda x: x["metric"])

    print(json.dumps(items, indent=2))
    if args.dry_run:
        print("(dry run - nothing written)")
        return
    write_seed(items)
    print("Done. Next: in a Coach Claude chat, say 'read pb_seed from the "
          "Training Log and upsert the Current PBs collection' to finish "
          "the seeding.")


if __name__ == "__main__":
    main()
